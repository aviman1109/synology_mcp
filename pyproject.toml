[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synology-mcp"
version = "0.1.0"
description = "Synology DSM MCP server — system info, DNS Server, package management, storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.23.0,<2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.30.0",
    "starlette>=0.40.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
synology-mcp = "synology_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synology_mcp"]
